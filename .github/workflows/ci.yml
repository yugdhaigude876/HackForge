name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js Runtime
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Clean Install Dependencies
        run: npm ci

      - name: Code Quality Linting
        run: npm run lint

      - name: Strict TypeScript Compilation Check
        run: npx tsc --noEmit

      - name: Execute Vitest Suite
        run: npm test

      - name: Production Build Validation
        run: npm run build
        env:
          NEXT_PUBLIC_DEFAULT_ORG_ID: org_demo

  security-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    continue-on-error: true # Non-blocking so third-party upstream advisories are visible without blocking merges
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js Runtime
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Clean Install Dependencies
        run: npm ci

      - name: High-Severity Production Dependency Audit
        run: npm audit --omit=dev --audit-level=high

  emulator-rules-and-e2e:
    name: Emulator Rules & E2E Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Java 21 (Required for Firebase Emulators)
        uses: actions/setup-java@8df1039502657977a67b46ea9242316616297329 # v4.6.1
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node.js Runtime
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Clean Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Firestore Rules Tests under Local Emulator
        run: npm run test:rules
        env:
          GCLOUD_PROJECT: demo-reserve-juggler

      - name: Run End-to-End Playwright Tests
        run: npm run test:e2e
        env:
          GCLOUD_PROJECT: demo-reserve-juggler
          NEXT_PUBLIC_USE_AUTH_EMULATOR: "true"
          FIREBASE_AUTH_EMULATOR_HOST: "127.0.0.1:9099"
          FIRESTORE_EMULATOR_HOST: "127.0.0.1:8080"
